<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f1420"/><stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#818cf8;#38bdf8" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#818cf8"><animate attributeName="stop-color" values="#818cf8;#38bdf8;#818cf8" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="t1"><rect x="60" y="118" height="60"><animate attributeName="width" values="0;330;330;0" keyTimes="0;0.25;0.9;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="60" y="200" height="40"><animate attributeName="width" values="0;0;470;470;0" keyTimes="0;0.28;0.5;0.9;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <style>
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .float{animation:float 3.2s ease-in-out infinite}
    .blink{animation:blink 1s steps(1) infinite}
    .twinkle{animation:tw 3s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
  </style>
  <rect width="900" height="320" rx="18" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="899" height="319" rx="17.5" stroke="#38bdf8" stroke-opacity=".35"/>
  <!-- stars -->
  <g fill="#7dd3fc">
    <circle class="twinkle" cx="470" cy="40" r="2"/><circle class="twinkle" cx="620" cy="70" r="1.5" style="animation-delay:.8s"/>
    <circle class="twinkle" cx="820" cy="50" r="2" style="animation-delay:1.6s"/><circle class="twinkle" cx="540" cy="270" r="1.5" style="animation-delay:2.2s"/>
    <circle class="twinkle" cx="860" cy="250" r="2" style="animation-delay:1.1s"/><circle class="twinkle" cx="420" cy="120" r="1.5" style="animation-delay:.4s"/>
  </g>
  <!-- window chrome -->
  <circle cx="40" cy="36" r="6" fill="#ff5f87"/><circle cx="62" cy="36" r="6" fill="#ffc15e"/><circle cx="84" cy="36" r="6" fill="#7ee0a8"/>
  <text x="110" y="40" class="mono" font-size="13" fill="#7a8aa8">~/yice-xu/portfolio</text>
  <!-- text -->
  <text x="60" y="110" class="mono" font-size="16" fill="#7a8aa8">&gt; whoami</text>
  <text x="60" y="165" class="mono" font-size="44" font-weight="700" fill="url(#pink)" clip-path="url(#t1)">hi, I'm Yice!</text>
  <text x="60" y="226" class="mono" font-size="20" fill="#e2ecfc" clip-path="url(#t2)">full stack dev | react native + laravel</text>
  <rect class="blink" x="60" y="262" width="12" height="22" fill="#38bdf8"/>
  <!-- code glyph -->
  <g transform="translate(640,95)"><g class="float">
    <ellipse cx="120" cy="190" rx="90" ry="10" fill="#38bdf8" opacity=".18" filter="url(#glow)"/>
    <text x="0" y="130" class="mono" font-size="110" font-weight="700" fill="url(#pink)">&lt;/&gt;</text>
  </g></g>
</svg>
